<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
  <defs>
    <style>
      .bg { fill: #faf8f4; }
      .domain { fill: #eef3f6; stroke: #667784; stroke-width: 3; }
      .wall { fill: none; stroke: #111111; stroke-width: 5; }
      .wall-ext { fill: none; stroke: #111111; stroke-width: 5; }
      .grid { fill: none; stroke: #8ea1ad; stroke-width: 1.5; opacity: 0.95; }
      .grid-strong { fill: none; stroke: #738896; stroke-width: 2.2; opacity: 0.95; }
      .refine { fill: #ffd7b5; opacity: 0.55; stroke: #d67d1b; stroke-width: 2; stroke-dasharray: 10 8; }
      .guide { fill: none; stroke: #444; stroke-width: 2.2; marker-start: url(#arrow); marker-end: url(#arrow); }
      .guide-small { fill: none; stroke: #444; stroke-width: 2; marker-start: url(#arrow); marker-end: url(#arrow); }
      .axis { stroke: #444; stroke-width: 2.5; marker-end: url(#arrow); }
      .label { font-family: "Times New Roman", serif; font-size: 26px; fill: #1b1b1b; }
      .label-small { font-family: "Times New Roman", serif; font-size: 22px; fill: #1b1b1b; }
      .label-tiny { font-family: "Times New Roman", serif; font-size: 20px; fill: #1b1b1b; }
      .title { font-family: "Times New Roman", serif; font-size: 34px; fill: #111111; font-weight: bold; }
      .note { font-family: "Times New Roman", serif; font-size: 20px; fill: #2c2c2c; }
      .pt { fill: #b12222; stroke: white; stroke-width: 2; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="860"/>

  <!-- Key geometry points -->
  <!-- P0 = (160,600), P1 = (610,505), P2 = (900,400), P3 = (1180,400) -->

  <!-- Domain -->
  <path class="domain" d="M 160 600 L 610 505 L 900 400 L 1180 400 L 1240 120 L 120 120 Z"/>

  <!-- Refinement zone around corner / separation / reattachment -->
  <path class="refine" d="M 470 555 L 760 485 L 1000 385 L 980 250 L 700 250 L 470 330 Z"/>

  <!-- j-like grid lines -->
  <path class="grid" d="M 120 170 Q 170 250 160 600"/>
  <path class="grid" d="M 180 160 Q 220 250 214 589"/>
  <path class="grid" d="M 240 150 Q 272 245 267 577"/>
  <path class="grid" d="M 300 142 Q 325 235 321 566"/>
  <path class="grid" d="M 360 136 Q 382 225 374 555"/>
  <path class="grid" d="M 420 132 Q 438 212 428 543"/>
  <path class="grid" d="M 480 128 Q 496 200 481 532"/>
  <path class="grid-strong" d="M 540 125 Q 553 190 535 521"/>
  <path class="grid-strong" d="M 600 123 Q 615 180 592 509"/>
  <path class="grid-strong" d="M 660 122 Q 674 170 649 491"/>
  <path class="grid-strong" d="M 720 121 Q 732 162 708 469"/>
  <path class="grid-strong" d="M 780 120 Q 790 154 770 447"/>
  <path class="grid-strong" d="M 840 120 Q 848 148 836 423"/>
  <path class="grid" d="M 900 120 Q 905 145 900 400"/>
  <path class="grid" d="M 960 120 Q 965 145 960 400"/>
  <path class="grid" d="M 1020 120 Q 1025 145 1020 400"/>
  <path class="grid" d="M 1080 120 Q 1085 145 1080 400"/>
  <path class="grid" d="M 1140 120 Q 1145 145 1140 400"/>
  <path class="grid" d="M 1200 120 Q 1205 145 1200 400"/>

  <!-- i-like grid lines -->
  <path class="grid" d="M 126 520 Q 410 505 1200 286"/>
  <path class="grid" d="M 132 492 Q 430 480 1205 260"/>
  <path class="grid" d="M 138 465 Q 452 455 1210 235"/>
  <path class="grid" d="M 144 438 Q 474 430 1215 212"/>
  <path class="grid-strong" d="M 150 410 Q 500 405 1220 190"/>
  <path class="grid-strong" d="M 156 382 Q 528 380 1225 170"/>
  <path class="grid-strong" d="M 162 355 Q 558 355 1230 152"/>
  <path class="grid-strong" d="M 168 328 Q 590 331 1233 138"/>
  <path class="grid" d="M 174 300 Q 625 307 1236 128"/>
  <path class="grid" d="M 180 272 Q 662 282 1238 121"/>
  <path class="grid" d="M 186 245 Q 700 258 1240 120"/>
  <path class="grid" d="M 192 218 Q 738 232 1240 120"/>
  <path class="grid" d="M 198 192 Q 774 208 1240 120"/>
  <path class="grid" d="M 204 166 Q 810 184 1240 120"/>

  <!-- Wall and exterior boundaries -->
  <path class="wall" d="M 160 600 L 610 505 L 900 400 L 1180 400"/>
  <path class="wall-ext" d="M 1180 400 L 1240 120"/>
  <path class="wall-ext" d="M 120 120 L 1240 120"/>
  <path class="wall-ext" d="M 120 120 L 160 600"/>

  <!-- Dimension arrows -->
  <path class="guide" d="M 190 548 L 580 467"/>
  <path class="guide-small" d="M 646 476 L 875 393"/>
  <path class="guide-small" d="M 920 372 L 1160 372"/>

  <!-- Point markers -->
  <circle class="pt" cx="160" cy="600" r="7"/>
  <circle class="pt" cx="610" cy="505" r="7"/>
  <circle class="pt" cx="900" cy="400" r="7"/>
  <circle class="pt" cx="1180" cy="400" r="7"/>

  <!-- Axes -->
  <path class="axis" d="M 85 690 L 220 690"/>
  <path class="axis" d="M 85 690 L 85 560"/>
  <text class="label-small" x="228" y="698">x</text>
  <text class="label-small" x="72" y="548">y</text>

  <!-- Labels -->
  <text class="title" x="90" y="62">Sidharth-Type Validation Grid Schematic</text>

  <text class="label" x="300" y="500">50 mm</text>
  <text class="label" x="735" y="450">32 mm</text>
  <text class="label" x="1020" y="360">40 mm shoulder</text>

  <text class="label-small" x="288" y="595">12 deg</text>
  <text class="label-small" x="720" y="500">20 deg or 22 deg</text>

  <text class="label-small" x="114" y="395" transform="rotate(-90 114 395)">inlet</text>
  <text class="label-small" x="650" y="102">top boundary</text>
  <text class="label-small" x="1260" y="270" transform="rotate(-90 1260 270)">outlet</text>

  <text class="label-small" x="124" y="630">P0</text>
  <text class="label-small" x="615" y="535">P1</text>
  <text class="label-small" x="905" y="430">P2</text>
  <text class="label-small" x="1186" y="430">P3</text>

  <text class="label-small" x="76" y="737">single-block body-fitted H-grid</text>
  <text class="note" x="86" y="770">Bottom boundary is entirely wall: P0 - P1 - P2 - P3</text>
  <text class="note" x="86" y="800">Refine strongly near the corner, separation zone, shear layer, and reattachment</text>

  <text class="label-small" x="592" y="290">corner / separation /</text>
  <text class="label-small" x="625" y="320">reattachment refinement</text>

  <text class="note" x="1075" y="150">farfield-like top</text>
  <text class="note" x="1086" y="176">keep shocks away</text>
  <text class="note" x="1098" y="202">from top boundary</text>
</svg>
